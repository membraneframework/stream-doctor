name: Release

# Builds the daemon on every supported platform and, for a `v*` tag matching
# package.json, publishes @stream-doctor/<platform> for each of them followed
# by the stream-doctor wrapper. A manual run only builds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  OTP_VERSION: "28.3"
  ELIXIR_VERSION: "1.19.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: macos_arm
            runner: macos-latest
          # Linux binaries bundle the runner's OTP and NIFs, so they need the
          # runner's glibc or newer; 22.04 (glibc 2.35) reaches Ubuntu 22.04
          # and Debian 12, 24.04 would not
          - platform: linux-arm64
            target: linux_arm
            runner: ubuntu-22.04-arm
          - platform: linux-x64
            target: linux_x86
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: daemon
    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.target }}
      # Membrane plugins' mix.exs create deps/<plugin>/priv/plts when CI=true.
      # That makes mix symlink the build-tree priv there, and bundlex then
      # copies each precompiled bundle into every plugin instead of linking it
      # (linux-x64 came out at 385 MB, over npm's limit).
      CI: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        if: runner.os == 'Linux'
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install Erlang and Elixir
        if: runner.os == 'macOS'
        run: brew install erlang elixir xz

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            daemon/deps
            daemon/_build
          key: release-${{ matrix.platform }}-${{ hashFiles('daemon/mix.lock') }}
          restore-keys: release-${{ matrix.platform }}-

      - run: mix deps.get

      # Burrito's prebuilt ERTS is unusable here: on Linux it is a musl build
      # that cannot load the glibc NIFs compiled on the runner, and on macOS
      # Homebrew's newest OTP may not be offered yet (29.0.6 -> 404). Bundle the
      # runner's own OTP instead; mix.exs picks the tarball up as custom_erts.
      - name: Pack the host ERTS
        run: rel/pack_host_erts.sh

      - run: mix release --overwrite

      - name: Smoke test
        run: |
          bin=burrito_out/stream_doctor_${{ matrix.target }}
          chmod +x "$bin"
          "$bin" &
          for _ in $(seq 60); do
            if curl -sf http://localhost:4040/status; then exit 0; fi
            sleep 2
          done
          echo "the daemon did not come up"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: stream_doctor-${{ matrix.platform }}
          path: daemon/burrito_out/stream_doctor_${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ts
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: sdks/ts/package-lock.json

      - name: Check that the tag matches package.json
        run: |
          version=$(npm pkg get version | tr -d '"')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: stream_doctor-*
          path: sdks/ts/artifacts

      - run: npm ci

      # platform packages go first so the wrapper never points at a package
      # that is not there yet; versions already on npm are skipped so a rerun
      # after a partial publish can finish the job
      - name: Publish platform packages
        run: |
          version=$(npm pkg get version | tr -d '"')
          for dir in npm/*/; do
            platform=$(basename "$dir")
            mkdir -p "$dir/bin"
            cp "artifacts/stream_doctor-$platform"/* "$dir/bin/stream_doctor"
            chmod +x "$dir/bin/stream_doctor"
            if npm view "@stream-doctor/$platform@$version" version >/dev/null 2>&1; then
              echo "@stream-doctor/$platform@$version is already published, skipping"
            else
              (cd "$dir" && npm pkg set version="$version" && npm publish --provenance --access public)
            fi
            npm pkg set "optionalDependencies.@stream-doctor/$platform=$version"
          done

      - name: Publish stream-doctor
        run: |
          version=$(npm pkg get version | tr -d '"')
          if npm view "stream-doctor@$version" version >/dev/null 2>&1; then
            echo "stream-doctor@$version is already published, skipping"
          else
            npm publish --provenance --access public
          fi
