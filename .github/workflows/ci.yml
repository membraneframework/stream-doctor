name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ts_sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    container: rust:latest
    defaults:
      run:
        working-directory: stream_doctor_native
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            stream_doctor_native
            daemon/native/stream_doctor_native_nif
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy --manifest-path ../daemon/native/stream_doctor_native_nif/Cargo.toml -- -D warnings
      - run: cargo fmt --check --manifest-path ../daemon/native/stream_doctor_native_nif/Cargo.toml

  # the membraneframework/membrane_actions reusable workflows assume the mix
  # project at the repository root, so their steps are inlined here
  daemon:
    runs-on: ubuntu-latest
    container:
      image: membraneframeworklabs/docker_membrane:latest
      env:
        ASDF_DATA_DIR: /root/.asdf
    defaults:
      run:
        working-directory: daemon
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - run: cp /root/.tool-versions .
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            daemon/deps
            daemon/_build
          key: daemon-${{ hashFiles('daemon/mix.lock') }}
          restore-keys: daemon-
      - run: mix deps.get
      - run: mix compile --force --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors
      - run: mix credo
        env:
          MIX_ENV: dev
      - run: mix dialyzer
        env:
          MIX_ENV: dev
